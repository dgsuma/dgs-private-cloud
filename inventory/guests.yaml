guests:
  - vm_id: 210
    proxmox_name: talos-cp-01
    guest_hostname: talos-cp-01
    type: qemu_vm
    role: kubernetes_control_plane
    operating_system:
      distribution: Talos Linux
      version: v1.13.6
      architecture: amd64
    resources:
      vcpu: 4
      memory_gib: 8
      system_disk_gib: 64
      disk_storage: vmdata
      bridge: vmbr0
      virtual_nic_model: VirtIO
    network:
      ipv4_address: 192.168.1.210
      assignment: dhcp_reservation
      gateway: 192.168.1.1
      dns: 192.168.1.1
    boot:
      order:
        - scsi0
        - ide2
        - net0
      installation_media_attached: false
    lifecycle:
      active: true
      kubernetes_ready: true
      autostart: false
      backup_configured: false
      restore_tested: false
    last_verified: 2026-07-26

