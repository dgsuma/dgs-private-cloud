network:
  lan_cidr: 192.168.1.0/24

  router:
    model: TP-Link Archer NX200
    lan_address: 192.168.1.1
    mobile_profile:
      name: Vodafone-IPv4
      pdp_type: IPv4
      apn: live.vodafone.com
      authentication: NONE

  proxmox:
    node_name: pve01
    management_address: 192.168.1.201/24
    fqdn: pve01.home.arpa
    gateway: 192.168.1.1
    dns: 192.168.1.1
    bridge: vmbr0
    bridge_port: nic0
    mac_address_recorded_privately: true

  talos:
    control_plane:
      vm_id: 210
      name: talos-cp-01
      address: 192.168.1.210/24
      dhcp_reservation: active
      mac_address_recorded_privately: true
      talos_api_port: 50000
      kubernetes_api_port: 6443
      connectivity_verified: true

    planned_workers:
      - vm_id: 211
        name: talos-wk-01
        address: 192.168.1.211/24
      - vm_id: 212
        name: talos-wk-02
        address: 192.168.1.212/24

    future_api_vip:
      address: 192.168.1.220
      state: reserved_not_configured

  retired:
    asus_pve:
      address: 192.168.1.203/24
      active: false
      cluster_joined: false

  admin_workstation:
    device: LG Gram
    network_path: LAN_or_WiFi
