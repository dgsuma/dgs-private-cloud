network:
  lan_cidr: 192.168.1.0/24

  router:
    model: TP-Link Archer NX200
    lan_address: 192.168.1.1
    mobile_profile:
      name: Vodafone-IPv4
      pdp_type: IPv4
      apn: live.vodafone.com
      authentication: NONE

  proxmox:
    node_name: pve01
    management_address: 192.168.1.201/24
    fqdn: pve01.home.arpa
    gateway: 192.168.1.1
    dns: 192.168.1.1
    bridge: vmbr0
    bridge_port: nic0
    management_port: 8006
    mac_address_recorded_privately: true
    subnet_router:
      provider: tailscale
      advertised_route: 192.168.1.0/24
      ipv4_forwarding: true
      ipv6_forwarding: true
      exit_node: false

  talos:
    api_endpoint: 192.168.1.210
    talos_api_port: 50000
    kubernetes_api_port: 6443
    nodes:
      - vm_id: 210
        name: talos-cp-01
        role: control_plane
        address: 192.168.1.210/24
        dhcp_reservation: active
      - vm_id: 211
        name: talos-worker-01
        role: worker
        address: 192.168.1.211/24
        dhcp_reservation: active
      - vm_id: 212
        name: talos-worker-02
        role: worker
        address: 192.168.1.212/24
        dhcp_reservation: active
    future_api_vip:
      address: 192.168.1.220
      state: reserved_not_configured

  jenkins:
    vm_id: 220
    name: jenkins-ci
    address: 192.168.1.213/24
    dhcp_reservation: active
    direct_http_port: 8080
    direct_lan_access: blocked_by_loopback_binding
    private_access:
      provider: tailscale
      method: serve
      https: true
      tailnet_only: true
      funnel_enabled: false
  administration:
    device: LG Gram
    path: trusted_lan_or_authenticated_tailscale_private_access
    travel_client: LG_Gram_WSL2_via_Windows_Tailscale
    kubernetes_remote_method: tailscale_operator_api_proxy
    talos_remote_method: tailscale_subnet_route
    proxmox_remote_method: direct_tailscale
    external_network_validation: alternate_wifi_and_mobile_hotspot
    direct_public_exposure_allowed: false
