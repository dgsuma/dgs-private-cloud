network:
  lan_cidr: 192.168.1.0/24

  router:
    model: TP-Link Archer NX200
    lan_address: 192.168.1.1
    mobile_profile:
      name: Vodafone-IPv4
      pdp_type: IPv4
      apn: live.vodafone.com
      authentication: NONE

  proxmox:
    node_name: pve01
    management_address: 192.168.1.201/24
    fqdn: pve01.home.arpa
    gateway: 192.168.1.1
    dns: 192.168.1.1
    bridge: vmbr0
    bridge_port: nic0
    mac_address_recorded_privately: true

  talos:
    api_endpoint:
      address: 192.168.1.210
      port: 50000

    kubernetes_endpoint:
      url: https://192.168.1.210:6443

    nodes:
      - vm_id: 210
        name: talos-cp-01
        role: controlplane
        address: 192.168.1.210/24
        dhcp_reservation: active
        mac_address_recorded_privately: true

      - vm_id: 211
        name: talos-worker-01
        role: worker
        address: 192.168.1.211/24
        dhcp_reservation: active
        mac_address_recorded_privately: true

      - vm_id: 212
        name: talos-worker-02
        role: worker
        address: 192.168.1.212/24
        dhcp_reservation: active
        mac_address_recorded_privately: true

    future_api_vip:
      address: 192.168.1.220
      state: reserved_not_configured

  retired:
    asus_pve:
      address: 192.168.1.203/24
      active: false
      cluster_joined: false

  admin_workstation:
    device: LG Gram
    network_path: LAN_or_WiFi
