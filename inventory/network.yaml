network:
  lan_cidr: 192.168.1.0/24

  router:
    model: TP-Link Archer NX200
    lan_address: 192.168.1.1
    mobile_profile:
      name: Vodafone-IPv4
      pdp_type: IPv4
      apn: live.vodafone.com
      authentication: NONE

  proxmox:
    main_node:
      node_name: pve01
      management_address: 192.168.1.201/24
      fqdn: pve01.home.arpa
      gateway: 192.168.1.1
      dns: 192.168.1.1
      bridge: vmbr0
      bridge_port: nic0
      address_assignment: router_reservation
      mac_address_recorded_privately: true

  guests:
    - vm_id: 100
      proxmox_name: ubuntu-web-test
      guest_hostname: web-test01
      address: 192.168.1.205/24
      assignment: dhcp_reservation
      router_reservation_active: true
      bridge: vmbr0
      virtual_nic_model: VirtIO
      mac_address_recorded_privately: true

  retired_addresses:
    - address: 192.168.1.203/24
      previous_node: asus-pve
      current_status: no_active_proxmox_node

  admin_workstation:
    device: LG Gram
    address_assignment: DHCP

  last_verified: 2026-07-21