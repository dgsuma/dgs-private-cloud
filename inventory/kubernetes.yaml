kubernetes:
  cluster_name: dgs-homelab
  state: operational
  last_verified: 2026-08-16

  platform:
    talos_version: v1.13.6
    kubernetes_version: v1.36.2
    kernel_version: 6.18.38-talos
    architecture: amd64
    container_runtime: containerd
    container_runtime_version: 2.2.5
    cni: flannel

  endpoint:
    url: https://192.168.1.210:6443
    high_availability: false

  topology:
    physical_hosts: 1
    control_plane_nodes: 1
    worker_nodes: 2
    all_nodes_ready: true
    physically_highly_available: false

  nodes:
    - name: talos-cp-01
      vm_id: 210
      role: control-plane
      address: 192.168.1.210
      ready: true
      etcd_member: true
      schedulable: true

    - name: talos-worker-01
      vm_id: 211
      role: worker
      address: 192.168.1.211
      ready: true
      etcd_member: false
      schedulable: true

    - name: talos-worker-02
      vm_id: 212
      role: worker
      address: 192.168.1.212
      ready: true
      etcd_member: false
      schedulable: true

  system_workloads:
    coredns: running
    kube_apiserver: running
    kube_controller_manager: running
    kube_scheduler: running
    kube_proxy: running_on_all_nodes
    flannel: running_on_all_nodes

  validation:
    talos_health: passed_after_backup_restart
    node_readiness: passed
    system_pods: passed
    workload_scheduling:
      image: nginx:stable-alpine
      replicas: 4
      worker_01_replicas: 2
      worker_02_replicas: 2
      cleanup_completed: true

  backup:
    etcd_snapshots:
      count: 2
      dates:
        - 2026-07-26
        - 2026-08-01
      sha256_files_created: true
      stored_off_cluster: true

    proxmox_vm_backup:
      configured: true
      generation_completed: true
      date: 2026-08-01
      vm_ids:
        - 210
        - 211
        - 212
      storage_id: usb-backup-2tb
      storage_disabled_after_backup: true
      storage_unmounted_after_backup: true
      storage_disconnected_after_backup: true
      restore_tested: false

  gitops:
    flux_bootstrapped: true
    flux_version: v2.9.3
    repository: dgsuma/dgs-private-cloud
    branch: main
    path: clusters/beelink-talos
    authentication: ssh_deploy_key
    gitrepository_ready: true
    kustomization_ready: true
    temporary_bootstrap_pat_revoked: true
    sops_configured: false

  private_access:
    provider: tailscale
    operator_deployed: true
    namespace: tailscale
    helm_chart: tailscale-operator
    helm_chart_version: 1.98.9
    helmrepository_ready: true
    helmrelease_ready: true
    deployment_name: operator
    deployment_available: true
    pod_ready: true
    ingress_class: tailscale
    operator_hostname: beelink-talos-operator
    operator_tag: tag:k8s-operator
    proxy_tag: tag:k8s
    oauth_secret_name: operator-oauth
    oauth_secret_managed_in_git: false
    kubernetes_api_proxy_enabled: true

  storage:
    state: operational
    storage_class_present: true
    default_storage_class: local-path
    provisioner: rancher.io/local-path
    provisioner_release: v0.0.37
    namespace: local-path-storage
    dynamic_provisioning_configured: true
    reclaim_policy: Delete
    volume_binding_mode: WaitForFirstConsumer
    talos_user_volume: u-local-path-provisioner
    mount_path: /var/mnt/local-path-provisioner
    worker_data_disk_gib: 300
    dynamic_pvc_test: passed
    pod_recreation_persistence_test: passed
    reclaim_cleanup_test: passed
    replicated: false
    flux_managed: false

  observability:
    state: metrics_alerting_and_logging_operational
    namespace: monitoring
    delivery: flux_helmrelease
    kube_prometheus_stack:
      chart_version: 88.2.0
      helmrelease_ready: true
    prometheus:
      deployed: true
      pvc_gib: 50
      storage_class: local-path
      pvc_bound: true
      retention: 15d
      retention_size: 40GB
      node_exporter_targets_up: 3
      node_exporter_targets_total: 3
    grafana:
      deployed: true
      pvc_gib: 5
      storage_class: local-path
      pvc_bound: true
      kubernetes_compute_dashboard_verified: true
      loki_datasource_provisioned: true
      loki_explore_verified: true
      private_tailscale_ingress_configured: true
    alertmanager:
      deployed: true
      pvc_gib: 2
      storage_class: local-path
      pvc_bound: true
      reconciled: true
      available: true
      external_receivers_configured: true
      email_receiver_configured: true
      email_delivery_firing_verified: true
      email_delivery_resolved_verified: true
      smtp_secret_name: alertmanager-smtp
      smtp_secret_managed_in_git: false
    node_exporter:
      daemonset_ready: true
      desired: 3
      ready: 3
      control_plane_covered: true
      workers_covered: 2
    pod_security:
      enforce: privileged
      audit: restricted
      warn: restricted
      scope: monitoring_namespace_only
    loki:
      deployed: true
      helm_chart_version: 18.7.6
      application_version: 3.7.6
      helmrelease_ready: true
      deployment_mode: monolithic
      replicas: 1
      storage_backend: filesystem
      schema: v13
      pvc_gib: 20
      storage_class: local-path
      pvc_bound: true
      gateway_enabled: true
      gateway_service_type: ClusterIP
      auth_enabled: false
      retention_configured: false
      api_buildinfo_verified: true
      api_labels_verified: true
    alloy:
      deployed: true
      helm_chart_version: 1.11.1
      application_version: v1.18.1
      helmrelease_ready: true
      controller: daemonset
      desired: 3
      ready: 3
      control_plane_covered: true
      workers_covered: 2
      collection_method: kubernetes_api
      source_component: loki.source.kubernetes
      destination: loki-gateway.monitoring.svc.cluster.local
      smoke_test_passed: true
      real_namespace_queries_verified:
        - monitoring
        - flux-system
        - tailscale
    homepage:
      deployed: true
      application_version: v1.13.2
      namespace: homepage
      delivery: flux_kustomize
      deployment_ready: true
      replicas: 1
      service_type: ClusterIP
      service_port: 3000
      tailscale_ingress_configured: true
      public_exposure_configured: false
      funnel_enabled: false
      runtime_secret_name: homepage-runtime
      runtime_secret_managed_in_git: false
      configmap_managed: true
      proxmox_config_stub_mounted: true
      writable_logs_emptydir: true
      pod_security_run_as_non_root: true
      crashloopbackoff_resolved: true
      restart_count_after_fix: 0
      repeated_http_200_validation_passed: true
      workstation_access_verified: true
      mobile_data_access_verified: true