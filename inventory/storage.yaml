storage:
  physical_disks:
    - device: /dev/nvme1n1
      model: CT1000P3PSSD8
      vendor: Crucial
      nominal_capacity_tb: 1
      role: proxmox_system
      destructive_operations_allowed: false

    - device: /dev/nvme0n1
      model: Samsung SSD 990 PRO 2TB
      vendor: Samsung
      nominal_capacity_tb: 2
      role: primary_guest_storage
      volume_group: vg_vmdata
      thin_pool: thin_vmdata
      proxmox_storage_id: vmdata

  proxmox_storage:
    - id: local
      type: directory
      purpose:
        - iso
        - templates
        - snippets
        - temporary_backups
      current_content:
        - Ubuntu Server 26.04 LTS ISO

    - id: local-lvm
      type: lvmthin
      purpose:
        - secondary_guest_disks

    - id: vmdata
      type: lvmthin
      approximate_usable_tib: 1.73
      metadata_gib: 1.11
      monitored: true
      purpose:
        - primary_vm_disks
        - primary_lxc_root_filesystems

  guest_volumes:
    - vm_id: 100
      guest_name: ubuntu-web-test
      storage_id: vmdata
      allocated_gib: 32
      provisioning: thin
      role: ubuntu_system_disk

  last_verified: 2026-07-21