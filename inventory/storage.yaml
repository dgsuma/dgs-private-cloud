storage:
  physical_disks:
    - device: /dev/nvme1n1
      model: CT1000P3PSSD8
      vendor: Crucial
      nominal_capacity_tb: 1
      role: proxmox_system
      destructive_operations_allowed: false

    - device: /dev/nvme0n1
      model: Samsung SSD 990 PRO 2TB
      vendor: Samsung
      nominal_capacity_tb: 2
      role: primary_guest_storage
      volume_group: vg_vmdata
      thin_pool: thin_vmdata
      proxmox_storage_id: vmdata

  proxmox_storage:
    - id: local
      type: directory
      purpose:
        - iso
        - templates
        - snippets
        - temporary_backups

    - id: local-lvm
      type: lvmthin
      purpose:
        - secondary_guest_disks

    - id: vmdata
      type: lvmthin
      approximate_usable_tib: 1.73
      monitored: true
      purpose:
        - primary_vm_disks
        - primary_lxc_root_filesystems

  active_allocations:
    - vm_id: 210
      name: talos-cp-01
      system_disk_gib: 64
      storage_id: vmdata
      talos_device: /dev/sda

  planned_allocations:
    - vm_id: 211
      name: talos-wk-01
      system_disk_gib: 64
      data_disk_gib: 300
      storage_id: vmdata

    - vm_id: 212
      name: talos-wk-02
      system_disk_gib: 64
      data_disk_gib: 300
      storage_id: vmdata

  retired_allocations:
    - vm_id: 100
      name: ubuntu-web-test
      state: deleted
      remaining_volumes: none_verified
