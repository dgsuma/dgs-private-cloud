apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: loki
      version: "18.7.6"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2026-08-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      storage:
        type: filesystem
      
      limits_config:
        retention_period: 336h

      compactor:
        working_directory: /var/loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem

    singleBinary:
      replicas: 1

      persistence:
        enabled: true
        storageClass: local-path
        accessModes:
          - ReadWriteOnce
        size: 20Gi

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    # These belong to SimpleScalable mode and must be zero
    # for this Monolithic deployment.
    read:
      replicas: 0

    write:
      replicas: 0

    backend:
      replicas: 0

    gateway:
      enabled: true

    # Avoid unnecessary Memcached overhead in this small lab.
    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    minio:
      enabled: false

    lokiCanary:
      enabled: true

    monitoring:
      serviceMonitor:
        enabled: true
