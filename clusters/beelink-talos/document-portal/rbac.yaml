apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: document-portal-secret-manager
  namespace: document-portal
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: document-portal-secret-manager
  namespace: document-portal
subjects:
  - kind: User
    name: dumindags@gmail.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: document-portal-secret-manager
  apiGroup: rbac.authorization.k8s.io
