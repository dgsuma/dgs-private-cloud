apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: novacart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
    spec:
      containers:
        - name: product-catalog
          image: ghcr.io/open-telemetry/demo:2.1.3-product-catalog
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 3550
          env:
            - name: PRODUCT_CATALOG_PORT
              value: "3550"
            - name: PRODUCT_CATALOG_RELOAD_INTERVAL
              value: "10"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: GOMEMLIMIT
              value: 16MiB
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=novacart,service.version=2.1.3
            - name: OTEL_SERVICE_NAME
              value: product-catalog
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 150m
              memory: 48Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: novacart
spec:
  selector:
    app: product-catalog
  ports:
    - name: grpc
      port: 3550
      targetPort: grpc
---
