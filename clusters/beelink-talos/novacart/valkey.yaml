apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-cart
  namespace: novacart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-cart
  template:
    metadata:
      labels:
        app: valkey-cart
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3-alpine
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-cart
  namespace: novacart
spec:
  selector:
    app: valkey-cart
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
