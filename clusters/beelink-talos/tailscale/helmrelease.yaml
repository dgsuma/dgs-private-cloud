apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    installCRDs: true

    operatorConfig:
      hostname: beelink-talos-operator
      logging: info
      defaultTags:
        - "tag:k8s-operator"

    proxyConfig:
      defaultTags: "tag:k8s"
      firewallMode: auto

    ingressClass:
      name: tailscale
      enabled: true

    apiServerProxyConfig:
      allowImpersonation: "true"
      mode: "true"

