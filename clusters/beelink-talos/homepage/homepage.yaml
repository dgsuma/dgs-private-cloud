apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
secrets:
  - name: homepage
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    kubernetes.io/service-account.name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true

  settings.yaml: |
    title: DGS Private Cloud
    description: Private cloud service dashboard
    target: _blank
    disableIndexing: true
    theme: dark
    color: slate
    background:
      image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
      opacity: 35
    cardBlur: md
    headerStyle: clean
    fullWidth: true
    useEqualHeights: true
    layout:
      Infrastructure:
        style: row
        columns: 3

      Observability:
        style: row
        columns: 4
      Websites:
        style: row
        columns: 2
      DevOps & GitOps:
        style: row
        columns: 3

  services.yaml: |
    - Infrastructure:
        - Proxmox VE:
            icon: proxmox.png
            href: https://mel-pve01.tail499e7c.ts.net/
            description: Virtualization platform
            widget:
              type: proxmox
              url: https://192.168.1.201:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
              fields:
                - vms
                - lxc
                - resources.cpu
                - resources.mem

        - Kubernetes:
            icon: kubernetes.png
            description: Talos Kubernetes cluster

        - Tailscale:
            icon: tailscale.png
            href: https://login.tailscale.com/admin/machines
            description: Private network access

    - Observability:
        - Grafana:
            icon: grafana.png
            href: "{{HOMEPAGE_VAR_GRAFANA_URL}}"
            description: Metrics, logs and alerts

        - Prometheus:
            icon: prometheus.png
            description: Metrics collection and PromQL
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              fields:
                - targets_up
                - targets_down
                - targets_total

        - Alertmanager:
            icon: alertmanager.png
            description: Alert routing and notifications
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 10000
              metrics:
                - label: Firing
                  query: 'sum(ALERTS{alertstate="firing",alertname!="Watchdog",alertname!="InfoInhibitor"}) or vector(0)'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Pending
                  query: 'sum(ALERTS{alertstate="pending",alertname!="Watchdog",alertname!="InfoInhibitor"}) or vector(0)'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Suppressed
                  query: 'sum(alertmanager_alerts{state="suppressed"}) or vector(0)'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0

        - Loki:
            icon: loki.png
            description: Centralized log aggregation

    - Websites:
        - Duminda Sumanasinghe:
            icon: "mdi-account-circle-#38bdf8"
            href: https://dumindas.com/
            description: Personal portfolio and DevOps profile

        - Nokzeo:
            icon: "mdi-fruit-cherries-#fb7185"
            href: https://nokzeo.com/
            description: Premium strawberry farm

    - DevOps & GitOps:
        - Jenkins:
            icon: jenkins.png
            href: https://jenkins-ci.tail499e7c.ts.net/
            description: CI pipelines and automation

        - FluxCD:
            icon: flux-cd.png
            description: Kubernetes GitOps reconciliation

        - GitHub:
            icon: github.png
            href: https://github.com/dgsuma/dgs-private-cloud
            description: DGS Private Cloud repository

  bookmarks.yaml: |
    []

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Talos Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - search:
        provider: duckduckgo
        target: _blank

    - openmeteo:
        label: Melbourne
        latitude: -37.8136
        longitude: 144.9631
        timezone: Australia/Melbourne
        units: metric
        cache: 5
        format:
          maximumFractionDigits: 1

    - datetime:
        text_size: md
        locale: en-AU
        format:
          dateStyle: medium
          timeStyle: short
          hour12: true
          timeZone: Australia/Melbourne

  docker.yaml: ""
  proxmox.yaml: ""
  custom.css: ""
  custom.js: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: HOMEPAGE_EXTERNAL_HOST
              valueFrom:
                secretKeyRef:
                  name: homepage-runtime
                  key: HOMEPAGE_EXTERNAL_HOST

            - name: HOMEPAGE_VAR_GRAFANA_URL
              valueFrom:
                secretKeyRef:
                  name: homepage-runtime
                  key: HOMEPAGE_VAR_GRAFANA_URL

            - name: HOMEPAGE_VAR_PROXMOX_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: HOMEPAGE_VAR_PROXMOX_TOKEN_ID

            - name: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET

            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,$(HOMEPAGE_EXTERNAL_HOST)"

            - name: LOG_TARGETS
              value: stdout

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: homepage-config
              mountPath: /app/config/custom.js
              subPath: custom.js
            - name: homepage-config
              mountPath: /app/config/custom.css
              subPath: custom.css
            - name: homepage-config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: homepage-config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: homepage-config
              mountPath: /app/config/proxmox.yaml
              subPath: proxmox.yaml
            - name: homepage-config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: homepage-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: homepage-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: homepage-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - mountPath: /app/config/logs
              name: logs

      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
