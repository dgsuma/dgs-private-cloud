apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
secrets:
  - name: homepage
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    kubernetes.io/service-account.name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true

  settings.yaml: |
    title: DGS Private Cloud
    description: Private cloud service dashboard
    target: _blank
    disableIndexing: true
    theme: dark
    color: slate
    background:
      image: /images/background.jpg
      opacity: 55
    cardBlur: md
    headerStyle: clean
    fullWidth: true
    useEqualHeights: true
    layout:
      Infrastructure:
        style: row
        columns: 3

      Observability:
        style: row
        columns: 5
      Websites:
        style: row
        columns: 4
      DevOps & GitOps:
        style: row
        columns: 5

  services.yaml: |
    - Infrastructure:
        - Proxmox VE:
            icon: proxmox.png
            href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
            description: Virtualization platform
            widget:
              type: proxmox
              url: https://192.168.1.201:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
              fields:
                - vms
                - lxc
                - resources.cpu
                - resources.mem

        - Kubernetes:
            icon: kubernetes.png
            description: Talos Kubernetes cluster

        - Tailscale:
            icon: "si-tailscale-#e2e8f0"
            href: https://login.tailscale.com/admin/machines
            description: Private network access

    - Observability:
        - Grafana:
            icon: grafana.png
            href: "{{HOMEPAGE_VAR_GRAFANA_URL}}"
            description: Dashboards and Explore

        - Prometheus:
            icon: prometheus.png
            description: Metrics and PromQL
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              fields:
                - targets_up
                - targets_down
                - targets_total

        - Loki:
            icon: loki.png
            description: Logs and LogQL
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 10000
              metrics:
                - label: Ingest
                  query: 'sum(rate(loki_distributor_bytes_received_total[5m])) or vector(0)'
                  format:
                    type: byterate
                - label: Lines
                  query: 'sum(rate(loki_distributor_lines_received_total[5m])) or vector(0)'
                  format:
                    type: number
                    suffix: "/s"
                    options:
                      maximumFractionDigits: 1
                - label: Missing
                  query: 'sum(increase(loki_canary_missing_entries_total[5m])) or vector(0)'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0

        - Tempo:
            icon: "mdi-chart-timeline-variant-shimmer-#f59e0b"
            href: "{{HOMEPAGE_VAR_GRAFANA_URL}}/explore"
            description: Traces and TraceQL

        - Alertmanager:
            icon: alertmanager.png
            description: Alerts and routing
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 10000
              metrics:
                - label: Firing
                  query: 'sum(ALERTS{alertstate="firing",alertname!="Watchdog",alertname!="InfoInhibitor"}) or vector(0)'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Pending
                  query: 'sum(ALERTS{alertstate="pending",alertname!="Watchdog",alertname!="InfoInhibitor"}) or vector(0)'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Suppressed
                  query: 'sum(alertmanager_alerts{state="suppressed"}) or vector(0)'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0

    - Websites:
        - DS:
            icon: "mdi-account-circle-#38bdf8"
            href: https://dumindas.com/
            description: Portfolio and DevOps

        - Nokzeo:
            icon: "mdi-fruit-cherries-#fb7185"
            href: https://nokzeo.com/
            description: Premium strawberry farm

        - ET:
            icon: "mdi-wallet-#80cbc4"
            href: https://expense-tracker.tail499e7c.ts.net
            description: Expense and income tracker

        - DP:
            icon: mdi-file-document-multiple-outline
            href: https://document-portal.tail499e7c.ts.net/
            description: AI-powered document portal and RAG application
    - DevOps & GitOps:
        - Jenkins:
            icon: jenkins.png
            href: "{{HOMEPAGE_VAR_JENKINS_URL}}"
            description: CI/CD automation

        - FluxCD:
            icon: flux-cd.png
            description: GitOps reconciliation

        - DGS Repo:
            icon: "si-github-#f8fafc"
            href: https://github.com/dgsuma/dgs-private-cloud
            description: Private Cloud GitOps

        - ET Repo:
            icon: "si-github-#f8fafc"
            href: https://github.com/dgsuma/expense-tracker-app
            description: Expense Tracker source

        - DP Repo:
            icon: "si-github-#f8fafc"
            href: https://github.com/dgsuma/document_portal
            description: Document Portal source repository
  bookmarks.yaml: |
    []

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Talos Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - search:
        provider: duckduckgo
        target: _blank

    - openmeteo:
        label: Melbourne
        latitude: -37.8136
        longitude: 144.9631
        timezone: Australia/Melbourne
        units: metric
        cache: 5
        format:
          maximumFractionDigits: 1

    - datetime:
        text_size: md
        locale: en-AU
        format:
          dateStyle: medium
          timeStyle: short
          hour12: true
          timeZone: Australia/Melbourne

  docker.yaml: ""
  proxmox.yaml: ""
  custom.css: |
    /* DGS Private Cloud — Stage 4B cyber infrastructure theme */

    body {
      background-color: #020617 !important;
    }

    #background {
      background-size: cover !important;
      background-position: center 40% !important;
      background-repeat: no-repeat !important;
    }

    /* DGS Private Cloud — responsive brand-safe header */

    #inner_wrapper {
      padding-top: 165px !important;
      box-sizing: border-box !important;
    }

    #information-widgets {
      margin-top: 0 !important;
    }

    #background {
      background-position: center top !important;
    }

    @media (max-width: 900px) {
      #inner_wrapper {
        padding-top: 150px !important;
      }

      #background {
        background-position: left top !important;
      }
    }

    #page_wrapper::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.12) 72%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.12) 72%, transparent);
    }

    #page_wrapper::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 16% 31%, rgba(56, 189, 248, 0.10), transparent 14%),
        radial-gradient(circle at 83% 29%, rgba(14, 165, 233, 0.09), transparent 16%),
        radial-gradient(circle at 66% 47%, rgba(239, 68, 68, 0.055), transparent 13%);
      mix-blend-mode: screen;
    }

    #inner_wrapper {
      position: relative;
      z-index: 1;
    }

    .service-card {
      background: rgba(7, 18, 32, 0.62) !important;
      border: 1px solid rgba(125, 211, 252, 0.14);
      box-shadow:
        0 14px 34px rgba(2, 6, 23, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background-color 180ms ease,
        box-shadow 180ms ease;
    }

    .service-card:hover {
      transform: translateY(-2px);
      background: rgba(10, 28, 48, 0.74) !important;
      border-color: rgba(56, 189, 248, 0.28);
      box-shadow:
        0 18px 42px rgba(2, 6, 23, 0.42),
        0 0 24px rgba(56, 189, 248, 0.07);
    }

    .service-group-name {
      letter-spacing: 0.025em;
      font-weight: 600 !important;
      color: rgb(186 230 253) !important;
      text-shadow: 0 2px 14px rgba(14, 165, 233, 0.18);
    }

    .service-name {
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .service-description {
      opacity: 0.82;
    }

    .service-icon img,
    .service-icon svg {
      filter: drop-shadow(0 4px 9px rgba(2, 6, 23, 0.32));
    }

    @media (prefers-reduced-motion: reduce) {
      .service-card {
        transition: none;
      }

      .service-card:hover {
        transform: none;
      }
    }

  custom.js: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list

  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      annotations:
        dgs.homepage/config-revision: "2026-09-25-document-portal-links"
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true

      securityContext:
        fsGroup: 1000

      initContainers:
        - name: otel-node-bootstrap
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              npm install --prefix /otel --no-audit --no-fund
              @opentelemetry/api@1.9.0
              @opentelemetry/auto-instrumentations-node@0.80.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: otel-node-modules
              mountPath: /otel

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: HOMEPAGE_EXTERNAL_HOST
              valueFrom:
                secretKeyRef:
                  name: homepage-runtime
                  key: HOMEPAGE_EXTERNAL_HOST

            - name: HOMEPAGE_VAR_GRAFANA_URL
              valueFrom:
                secretKeyRef:
                  name: homepage-runtime
                  key: HOMEPAGE_VAR_GRAFANA_URL

            - name: HOMEPAGE_VAR_PROXMOX_URL
              valueFrom:
                secretKeyRef:
                  name: homepage-runtime
                  key: HOMEPAGE_VAR_PROXMOX_URL

            - name: HOMEPAGE_VAR_JENKINS_URL
              valueFrom:
                secretKeyRef:
                  name: homepage-runtime
                  key: HOMEPAGE_VAR_JENKINS_URL

            - name: HOMEPAGE_VAR_PROXMOX_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: HOMEPAGE_VAR_PROXMOX_TOKEN_ID

            - name: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET

            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,$(HOMEPAGE_EXTERNAL_HOST)"

            - name: LOG_TARGETS
              value: stdout

            # OpenTelemetry tracing -> Alloy -> Tempo
            - name: OTEL_SERVICE_NAME
              value: homepage
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
              value: "http"
            - name: NODE_PATH
              value: "/otel/node_modules"
            - name: NODE_OPTIONS
              value: "--require @opentelemetry/auto-instrumentations-node/register"

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: otel-node-modules
              mountPath: /otel
              readOnly: true

            - name: homepage-background
              mountPath: /app/public/images/background.jpg
              subPath: background.jpg
              readOnly: true

            - name: homepage-config
              mountPath: /app/config/custom.js
              subPath: custom.js

            - name: homepage-config
              mountPath: /app/config/custom.css
              subPath: custom.css

            - name: homepage-config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml

            - name: homepage-config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml

            - name: homepage-config
              mountPath: /app/config/proxmox.yaml
              subPath: proxmox.yaml

            - name: homepage-config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml

            - name: homepage-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml

            - name: homepage-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml

            - name: homepage-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml

            - mountPath: /app/config/logs
              name: logs

      volumes:
        - name: otel-node-modules
          emptyDir: {}

        - name: homepage-background
          configMap:
            name: homepage-background

        - name: homepage-config
          configMap:
            name: homepage

        - name: logs
          emptyDir: {}
