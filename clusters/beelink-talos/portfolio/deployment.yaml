apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-portfolio
  namespace: portfolio
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: enhanced-portfolio

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: enhanced-portfolio

    spec:
      imagePullSecrets:
        - name: ghcr-pull

      containers:
        - name: portfolio
          image: ghcr.io/dgsuma/enhanced-portfolio-site:bootstrap

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
